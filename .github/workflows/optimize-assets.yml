name: Optimize showcase images
on:
  workflow_dispatch:
  push:
    branches: [feature/game-showcase-v2]
    paths:
      - 'scripts/optimize_images.py'
      - 'assets/*-bg.png'
      - 'assets/area81-logo.png'
      - '.github/workflows/optimize-assets.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/optimize_images.py
      - name: Commit optimized assets (only generated WebP files)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/optimized/
          if ! git diff --cached --quiet; then
            git commit -m "Optimize site game artwork for mobile"
            git push
          fi